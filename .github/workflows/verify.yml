name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run precache:check
      - run: npm test
      # Proves the shippable output actually contains every precached URL. The
      # critical install is atomic, so a file the copy step misses would leave
      # every visitor stuck on the previous service worker.
      - run: npm run build
